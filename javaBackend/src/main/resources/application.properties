spring.application.name=CSD

logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.csd.persistence=DEBUG
# The client (browser, REST caller, etc.) receives the error status, message, and timestamp, but no internal Java stacktrace
server.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://localhost:3306/productdb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
server.port=3001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# set to false after loading data from xlsx file to database
app.data.loading.enabled=true

# Email settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
user.service.url=http://localhost:3000/api/users/
user.service.api-key=123

# Security settings
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:3000/api/auth/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:3000

# Pinecone settings
pinecone.api.key=${PINECONE_API_KEY}
pinecone.index.host=hscode-d7154zi.svc.aped-4627-b74a.pinecone.io
pinecone.index.name=hscode
pinecone.namespace=__default__
pinecone.rerank.model=bge-reranker-v2-m3
pinecone.rerank.topN=5

# Cohere settings
cohere.api.key=${COHERE_API_KEY}
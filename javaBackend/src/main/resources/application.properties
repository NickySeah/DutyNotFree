spring.application.name=CSD

logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.csd.persistence=DEBUG
server.error.include-stacktrace=never

# Database connection - uses DB_HOST env variable for Docker, defaults to localhost
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:productdb}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
server.port=3001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# set to false after loading data from xlsx file to database
app.data.loading.enabled=true

# Email settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# User service URL - uses FRONTEND_URL env variable for Docker
user.service.url=${FRONTEND_URL:http://localhost:3000}/api/users/
user.service.api-key=123

# Security settings - uses FRONTEND_URL env variable for Docker
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${FRONTEND_URL:http://localhost:3000}/api/auth/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=${FRONTEND_URL:http://localhost:3000}